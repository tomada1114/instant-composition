# DynamoDB local for `pnpm test:dynamodb` and local runs of the API: `pnpm db:up`
# starts it, `pnpm db:down` removes it. ci.yml's `static` job runs the same
# image, pinned by tag and digest in both places (tests/workflows.test.ts
# holds the two together). The image's own command runs it in memory, so a
# restart starts from no tables at all.
name: instant-composition

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
    environment:
      DDB_LOCAL_TELEMETRY: "0"
    ports:
      # Loopback only: nothing off this machine reaches the container.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Any HTTP answer means it is listening; curl ships in the image.
      test:
        ["CMD", "curl", "--silent", "--output", "/dev/null", "http://localhost:8000"]
      interval: 2s
      timeout: 5s
      retries: 30
