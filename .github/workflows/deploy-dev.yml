name: Deploy dev

# ADR-0009: `dev` deploys on every merge to main, with no approval. The job
# assumes the deploy role from infra/'s `deploy-access` stack through GitHub's
# OIDC token, so no AWS access key exists anywhere; that role may only assume
# the CDK bootstrap roles, which do the deploying. Its ARN is the repository
# variable AWS_DEPLOY_ROLE_ARN, set from the stack's `DeployRoleArn` output.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  # One deploy at a time, in merge order. Never cancelled: stopping a
  # CloudFormation update part-way leaves it to roll back on its own, and the
  # cancelled push loses its only record.
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the dev foundation stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The OIDC token the deploy role's trust policy checks; nothing else here
      # writes.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Deploy the foundation stack
        run: pnpm cdk deploy -c stage=dev foundation --require-approval never
