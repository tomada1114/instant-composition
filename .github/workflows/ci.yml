name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing is inherited: every job below re-declares the scopes it needs.
permissions: {}

concurrency:
  # Superseding a pull request cancels its previous run. A push to main is
  # keyed by commit instead, so consecutive merges neither cancel one another
  # nor discard the CI record of the commit that already landed.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # DynamoDB local for the `Smoke test` and `DynamoDB contract suite` steps
    # below: the image compose.yaml runs on a checkout, pinned by tag and
    # digest in both places (tests/workflows.test.ts holds the two together).
    # The runner starts the steps only once the health check passes. A service
    # container needs a Linux runner, which is why it sits on this job and not
    # on `test`'s OS matrix.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1@sha256:ff89bd48ff32cd8d9be5fee8873b65b8854dc408f1afe881be6eb00247bc0dab
        env:
          DDB_LOCAL_TELEMETRY: "0"
        ports:
          - 8000:8000
        options: --health-cmd "curl --silent --output /dev/null http://localhost:8000" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Package scripts call pnpm recursively, so CI installs the reviewed
      # version on PATH. No `version:` input on purpose: the action reads the
      # exact `packageManager` string from package.json, which is the single
      # place that version is written. tests/workflows.test.ts fails if a
      # workflow starts stating one again.
      #
      # It also has to run *before* setup-node: setup-node's default
      # package-manager cache resolves the pnpm store path by invoking pnpm,
      # and pnpm is only on PATH once this step has run.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      # The browser client under apps/web is a static Vite bundle. Its types
      # are already checked by `Type check`; this step holds that the bundle
      # itself still builds.
      - name: Build the web client
        run: pnpm run web:build

      # The only check that starts the stack and asks it for a document and a
      # round over HTTP: the bundle above served by `vite preview`, in front
      # of the API on the DynamoDB service container. It sits here, after the
      # build, because it serves that build: in the `test` job below there is
      # none, and giving it one would mean building the client twice in a
      # single workflow. The default test run filters it out for the same
      # reason — see `test:smoke` in package.json.
      - name: Smoke test
        run: pnpm run test:smoke

      # The learner-store contract suite, isolation included, against the
      # DynamoDB adapter on the service container above. The default test run
      # filters it out because it needs that container — see `test:dynamodb`
      # in package.json — so this step is the one that runs it.
      - name: DynamoDB contract suite
        run: pnpm run test:dynamodb

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single source of coverage: it is collected exactly once across the
      # whole workflow.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:coverage

      - name: Run tests without coverage
        if: matrix.os != 'ubuntu-latest'
        run: pnpm run test
